name: Post your results
description: Share what Backburner did on your Mac and phone(s). Every device and number helps, slow ones too.
title: "[Results] <Mac> + <phone(s)>"
labels: ["results"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Fill in what you have; only the devices are required.
        The numbers come from `bench/turn-bench.py` (README → Reproducing the numbers). Pasting its output as-is is perfect.

  - type: input
    id: mac
    attributes:
      label: Mac
      description: Model, chip, memory
      placeholder: MacBook Pro 14", M4 Pro, 24 GB
    validations:
      required: true

  - type: textarea
    id: phones
    attributes:
      label: Phone(s) / iPad(s)
      description: One per line, with iOS version and the cable or port
      placeholder: |
        iPhone 17 Pro Max, iOS 27.0, 10 Gb/s USB-C cable
        iPhone 16 Pro Max, iOS 27.0, Thunderbolt 4 cable
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you installed the app
      options:
        - AltStore + release IPA (free Apple ID)
        - Xcode (developer team id)
        - Other (say below)
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model and quant
      placeholder: Qwen3.8-27B IQ4_XS (default)

  - type: textarea
    id: profile
    attributes:
      label: Device profile (optional)
      description: Output of `bench/device-probe.py` with the phone(s) plugged in and Backburner open. It holds no names, ids or addresses.
      render: json

  - type: textarea
    id: startup
    attributes:
      label: serve.sh startup line and phone-up.sh output
      description: "The `serve: ... split prefill on ... ANE pages ...` line, and the `... MiB app budget` line from scripts/phone-up.sh"
      render: shell

  - type: textarea
    id: turnbench
    attributes:
      label: Prefill, Mac alone vs Mac + phone
      description: Output of `bench/turn-bench.py --config mac` and `bench/turn-bench.py --config phone`
      render: shell

  - type: textarea
    id: other
    attributes:
      label: Other numbers
      description: Decode tok/s, long-context runs (bench/long-bench.py), session-bench, two phones, anything you measured
      render: shell

  - type: textarea
    id: experience
    attributes:
      label: How it went
      description: Setup problems, phone heat, whether the phone stayed usable, what you used it for, what you'd want next
